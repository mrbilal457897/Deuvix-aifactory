name: Booking reminders

# Vercel Hobby only allows one cron execution per day, so the 15-minute
# reminder sweep is triggered from GitHub Actions instead (free, open source).
#
# Setup (once, in the repository):
#   Settings -> Secrets and variables -> Actions -> Secrets   -> CRON_SECRET
#   Settings -> Secrets and variables -> Actions -> Variables -> SITE_URL
# Both are required. CRON_SECRET must exactly match CRON_SECRET in the site's
# own environment; SITE_URL must be the site's public origin, for example
# https://deux-aicompany.vercel.app
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Trigger /api/cron/reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Fail with an actionable message instead of silently requesting localhost.
      - name: Check configuration
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL repository variable is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set. Add it under Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi
          echo "SITE_URL = $SITE_URL"

      - name: Hit the reminders endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Print the body even on a non-2xx so a 401 or 503 explains itself;
          # --fail alone hides the reason the sweep did not run.
          response=$(curl --silent --show-error --max-time 60 \
            -w $'\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "$SITE_URL/api/cron/reminders") || {
            echo "::error::Could not reach $SITE_URL/api/cron/reminders"
            exit 1
          }

          status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "$body"

          case "$status" in
            200) ;;
            401) echo "::error::401 Unauthorized - CRON_SECRET here does not match CRON_SECRET on the site."; exit 1 ;;
            503) echo "::error::503 - DATABASE_URL is not set in the site's production environment."; exit 1 ;;
            *)   echo "::error::Endpoint returned HTTP $status"; exit 1 ;;
          esac

      - name: Summary
        if: always()
        run: echo "Reminders sweep finished at ${{ github.run_started_at }}"