name: Booking reminders

# Vercel Hobby only allows one cron execution per day, so the 15-minute
# reminder sweep is triggered from GitHub Actions instead (free, open source).
#
# Setup (once, in the repository):
#   Settings -> Secrets and variables -> Actions -> Secrets   -> CRON_SECRET
#   Settings -> Secrets and variables -> Actions -> Variables -> SITE_URL
# Both are required. CRON_SECRET must exactly match CRON_SECRET in the site's
# own environment; SITE_URL must be the site's public origin, e.g.
# https://deuvix-ai.com
#
# SITE_URL is also read from a same-named secret as a fallback, so the workflow
# still works if it was stored as a secret rather than a repository variable.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Trigger /api/cron/reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check configuration
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables (a same-named secret also works)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          echo "Target origin: $SITE_URL"
          echo "CRON_SECRET present: yes (value hidden)"

      - name: Hit the reminders endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          SITE_URL="${SITE_URL%/}"
          response=$(curl --silent --show-error --max-time 60 \
            -w $'\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "$SITE_URL/api/cron/reminders") || {
            echo "::error::Could not reach $SITE_URL/api/cron/reminders - check SITE_URL and that the site is online."
            exit 1
          }

          status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "HTTP $status"
          echo "$body"

          case "$status" in
            200) ;;
            401) echo "::error::401 - CRON_SECRET here does not match CRON_SECRET on the site (or it is unset there)."; exit 1 ;;
            503) echo "::error::503 - DATABASE_URL is not set in the site's production environment."; exit 1 ;;
            404) echo "::error::404 - SITE_URL points to the wrong origin or the deploy is missing /api/cron/reminders."; exit 1 ;;
            308|301|302|307) echo "::error::Redirect ($status). SITE_URL must be the bare origin with no trailing slash or path."; exit 1 ;;
            *)   echo "::error::Endpoint returned HTTP $status"; exit 1 ;;
          esac

      - name: Summary
        if: always()
        run: echo "Reminders sweep finished at ${{ github.run_started_at }}"
